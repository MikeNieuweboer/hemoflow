[project]
name = "preprocessorlbm-versatile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.16.0",
  "numpy>=2.5.5",
  "numpy-stl>=4.1.4",
  "pynrrd>=1.1.3",
  "vtk>=9.7.2",
]

[tool.ruff.lint]
select = ["ALL"]
# S101, asserts in code
# TD002, TD003; Extra todo information.
ignore = ["INP001", "CPY001", "S101", "TD002", "TD003"]
